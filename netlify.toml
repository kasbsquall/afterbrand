[build]
command = "export DATABASE_URL=\"${NETLIFY_DATABASE_URL:-$DATABASE_URL}\" && NITRO_PRESET=netlify pnpm build && if [ \"${CONTEXT:-}\" = \"production\" ]; then pnpm migrate:production; fi"
publish = "dist"
functions = ".netlify/functions-internal"

[build.environment]
NITRO_PRESET = "netlify"
NPM_CONFIG_PRODUCTION = "false"

[context.production.environment]
AGENT_NATIVE_DISABLE_KEEP_WARM_BACKGROUND = "1"
# Production release migrations own schema setup; request functions must skip
# migration probes on every serverless invocation.
AGENT_NATIVE_RELEASE_MIGRATIONS = "1"
# A public demo pays for every agent run: accounts by invitation only, and
# hard ceilings per run. The spend cap itself lives on the Anthropic key.
AUTH_SIGNUP = "invited"
ORG_CREATION = "closed"
AGENT_PROD_CODE_EXECUTION = "off"
AGENT_MAX_ITERATIONS = "60"
AGENT_MAX_RUN_INPUT_TOKENS = "3000000"
AGENT_MAIN_CHAT_MAX_OUTPUT_TOKENS = "16000"
